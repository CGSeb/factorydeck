name: Release CLI

on:
  push:
    tags: ['cli-v*']
  pull_request:
    paths:
      - 'cli/**'
      - 'src/cli-ingest/**'
      - '.github/workflows/release-cli.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check and pack the CLI without publishing it to npm
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: factorydeck
          POSTGRES_USER: factorydeck
          POSTGRES_PASSWORD: factorydeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factorydeck -d factorydeck"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factorydeck:factorydeck@127.0.0.1:5432/factorydeck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  pack-node-22:
    name: Pack on Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --version
      - run: pnpm vitest run cli/scripts/pack.test.ts

  publish:
    name: Publish
    needs: [check, pack-node-22]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag and the version
        id: release
        run: |
          if [ "$DRY_RUN" = true ]; then
            node cli/scripts/release.ts --tag "$TAG"
          else
            node cli/scripts/release.ts --tag "$TAG" --publish
          fi
      - run: pnpm --filter factorydeck build
      - name: Publish to npm (dry run)
        if: env.DRY_RUN == 'true'
        working-directory: cli
        run: npm publish --dry-run --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
      - name: Publish to npm
        if: env.DRY_RUN != 'true'
        working-directory: cli
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
