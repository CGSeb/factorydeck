<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 390" width="1280" height="390" role="img" aria-labelledby="title">
  <title id="title">The improvement loop: the factory runs, FactoryDeck shows it, you spot blockers and frictions, you tune the factory, and the share of issues merged without a person grows</title>
  <style>
    .hl{opacity:0;animation:hl 8s linear infinite}
    @keyframes hl{0%{opacity:1}12%{opacity:0}88%{opacity:0}100%{opacity:1}}
    .dot{offset-path:path('M170,125 H1100 V250 a30,30 0 0 1 -30,30 H200 a30,30 0 0 1 -30,-30 Z');animation:run 8s linear infinite}
    @keyframes run{from{offset-distance:0%}to{offset-distance:100%}}
    .fill{transform-box:fill-box;transform-origin:left center;animation:grow 32s step-end infinite}
    @keyframes grow{0%{transform:scaleX(0.38)}25%{transform:scaleX(0.49)}50%{transform:scaleX(0.6)}75%{transform:scaleX(0.71)}100%{transform:scaleX(0.38)}}
    .m{opacity:0}
    .m0{animation:m0 32s step-end infinite}.m1{animation:m1 32s step-end infinite}.m2{animation:m2 32s step-end infinite}.m3{animation:m3 32s step-end infinite}
    @keyframes m0{0%,0%{opacity:0}0.01%,25%{opacity:1}25.01%,100%{opacity:0}}@keyframes m1{0%,25%{opacity:0}25.01%,50%{opacity:1}50.010000000000005%,100%{opacity:0}}@keyframes m2{0%,50%{opacity:0}50.01%,75%{opacity:1}75.01%,100%{opacity:0}}@keyframes m3{0%,75%{opacity:0}75.01%,100%{opacity:1}100.01%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.hl,.dot,.fill,.m{animation:none}.dot{offset-distance:0%}.fill{transform:scaleX(0.71)}.m3{opacity:1}}
  </style>
  <rect width="1280" height="390" rx="24" fill="#f3f5f4"/>
  <path d="M170,125 H1100 V250 a30,30 0 0 1 -30,30 H200 a30,30 0 0 1 -30,-30 Z" fill="none" stroke="#b9c9c5" stroke-width="2" stroke-dasharray="6 7"/>
  <g class="dot"><circle r="13" fill="rgba(15,118,110,0.25)"/><circle r="6" fill="#0f766e"/></g>
  
  <g>
    <rect x="40" y="40" width="260" height="170" rx="16" fill="#ffffff" stroke="#dfe5e3"/>
    <rect class="hl" style="animation-delay:-8.00s" x="39" y="39" width="262" height="172" rx="17" fill="none" stroke="#0f766e" stroke-width="3"/>
    <text x="62" y="78" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0f766e">1 · BUILD</text>
    <text x="62" y="112" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#17201f">The factory runs</text>
    <text x="62" y="144" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">factorydeck-skills specs,</text><text x="62" y="166" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">builds, reviews and</text><text x="62" y="188" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">merges your issues</text>
  </g>
  <g>
    <rect x="350" y="40" width="260" height="170" rx="16" fill="#ffffff" stroke="#dfe5e3"/>
    <rect class="hl" style="animation-delay:-6.84s" x="349" y="39" width="262" height="172" rx="17" fill="none" stroke="#0f766e" stroke-width="3"/>
    <text x="372" y="78" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0f766e">2 · WATCH</text>
    <text x="372" y="112" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#17201f">FactoryDeck shows it</text>
    <text x="372" y="144" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">every issue, every agent</text><text x="372" y="166" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">thread, every time a</text><text x="372" y="188" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">person stepped in</text>
  </g>
  <g>
    <rect x="660" y="40" width="260" height="170" rx="16" fill="#ffffff" stroke="#dfe5e3"/>
    <rect class="hl" style="animation-delay:-5.69s" x="659" y="39" width="262" height="172" rx="17" fill="none" stroke="#0f766e" stroke-width="3"/>
    <text x="682" y="78" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0f766e">3 · SPOT</text>
    <text x="682" y="112" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#17201f">Blockers and frictions</text>
    <text x="682" y="144" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">spec questions, low scores,</text><text x="682" y="166" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">failed checks, denied</text><text x="682" y="188" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">tools, failed commands</text>
  </g>
  <g>
    <rect x="970" y="40" width="260" height="170" rx="16" fill="#ffffff" stroke="#dfe5e3"/>
    <rect class="hl" style="animation-delay:-4.53s" x="969" y="39" width="262" height="172" rx="17" fill="none" stroke="#0f766e" stroke-width="3"/>
    <text x="992" y="78" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0f766e">4 · IMPROVE</text>
    <text x="992" y="112" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#17201f">You tune the factory</text>
    <text x="992" y="144" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">specs, skills, hooks,</text><text x="992" y="166" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">permissions, thresholds</text><text x="992" y="188" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f"></text>
  </g>
  <path d="M319,118 L329,125 L319,132" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M629,118 L639,125 L629,132" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M939,118 L949,125 L939,132" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="465" y="264" width="340" height="32" rx="16" fill="#e3eeeb"/>
  <text x="635" y="285" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0f766e">next run: fewer stops, fewer frictions</text>
  <text x="322" y="354" text-anchor="end" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#55625f">Merged without a person</text>
  <rect x="340" y="340" width="600" height="16" rx="8" fill="#e3e9e7"/>
  <rect class="fill" x="340" y="340" width="600" height="16" rx="8" fill="#0f766e" style="transform:scaleX(0.38)"/>
  <text class="m m0" x="958" y="355" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#17201f">38%</text><text class="m m1" x="958" y="355" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#17201f">49%</text><text class="m m2" x="958" y="355" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#17201f">60%</text><text class="m m3" x="958" y="355" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#17201f">71%</text>
</svg>
