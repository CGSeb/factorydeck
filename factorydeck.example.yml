# FactoryDeck workflow configuration.
#
# Copy this file to factorydeck.yml at the repository root (ignored by git), or point
# FACTORYDECK_CONFIG in .env at another path. FactoryDeck reads it once at start-up and never
# writes it; restart the server after a change. Without a file, the defaults below apply.
# Never put secrets in it.
#
# Patterns are JavaScript regular expressions, matched case-insensitively, anywhere in the text
# unless anchored with ^ or $. Quote them with single quotes so YAML keeps backslashes as they are.

# Required, and must be 1.
version: 1

# Role rules are stored with each project in FactoryDeck, not in this file: `roles` keys here are
# ignored. A new project starts with the roles of the build-feature and fix-bug workflows of
# factorydeck-skills.

# Work items (issue numbers) of threads, tried in order: the first rule whose pattern matches and
# captures a positive whole number gives the work item.
#   from     the text to read: marker (the last line of each of the agent's replies in the main
#            thread), description (a sub-agent's description; skipped for a main thread), branch
#            (the thread's own git branch) or title (the session's title).
#   pattern  a pattern with exactly one capture group, the issue number. A marker pattern may also
#            hold a named group `role`.
# The marker rule reads the last line of the agent's replies: the write-spec skill of
# factorydeck-skills ends its work with `Work item: #<n> (spec-writer)` there. When a session has
# markers, its main-thread calls are split at them, whatever the rule's position: each call goes to
# the issue of the next marker, and the text in parentheses becomes the role of those calls.
# A sub-agent with no match takes the work item of its session's main thread.
# Without this key, the defaults are the three rules below.
work_items:
  - from: marker
    pattern: '^Work item: #(\d+)(?: \((?<role>[a-z][a-z0-9-]*)\))?$'
  - from: description
    pattern: '#(\d+)'
  - from: title
    pattern: '#(\d+)'
  # Fits branches named after issue numbers, such as feat/52-export:
  # - from: branch
  #   pattern: '^[a-z]+/(\d+)-'

# Optional overrides, keyed by project root path (absolute, or starting with ~). A project's
# `work_items`, when present, replace the global list for that project; they are not merged.
# projects:
#   ~/code/my-app:
#     work_items:
#       - from: branch
#         pattern: '^[a-z]+/(\d+)-'
